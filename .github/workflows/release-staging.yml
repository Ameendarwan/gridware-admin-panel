name: Release Staging
on:
  workflow_dispatch:
    inputs:
      commit-sha:
        description: '⬜ COMMIT-SHA: (Optional) Pick a specific commit to release to Staging (40 chars). If empty, HEAD will be used.'
        required: false
        type: string
        default: ''

jobs:
  prepare-version:
    name: Automatically generate version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.set_version.outputs.version }}
      sha: ${{ steps.resolve_commit.outputs.sha }}
    steps:
      - name: Check Commit SHA Format
        if: ${{ inputs.commit-sha != '' }}
        run: |
          sha="${{ inputs.commit-sha }}"

          if [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "✅ Commit SHA is valid: $sha"
          else
            echo "❌ Commit SHA is invalid. Must be exactly 40 lowercase hex characters (no spaces)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit-sha }}

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Perform semantic version release candidate
        uses: paulhatch/semantic-version@v5.4.0
        id: semantic_version_rc
        with:
          tag_prefix: 'v'
          major_pattern: 'major'
          minor_pattern: 'feat'
          version_format: 'v${major}.${minor}.${patch}-rc${increment}'
          user_format_type: 'csv'
          bump_each_commit: false
          search_commit_body: true
          bump_each_commit_patch_pattern: false
          debug: true

      - name: Rollback Staging & Delete GitHub Release and Tag if Exists
        if: ${{ inputs.commit-sha != '' }}
        id: check_tag_staging
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.semantic_version_rc.outputs.version }}"

          echo "Checking if tag $version exists in remote repo..."

          all_tags=$(git ls-remote --tags origin | awk '{print $2}' | sed 's|refs/tags/||')

          if echo "$all_tags" | grep -Fxq "$version"; then
            echo "Tag $version already exists. Deleting GitHub release and tag..."

            release_id=$(gh release view "$version" --json id -q .id || true)
            if [ -n "$release_id" ]; then
              gh release delete "$version" --yes
              echo "GitHub release $version deleted."
            else
              echo "No GitHub release found for $version."
            fi
            git tag -d "$version" || true
            git push origin ":refs/tags/$version" || true
            echo "Git tag $version deleted from local and remote."
          else
            echo "Tag $version not found in remote. No need to delete."
          fi

      - name: Set version
        id: set_version
        run: |
          if [ -n "${{ steps.semantic_version_rc.outputs.version }}" ]; then
            echo ${{ steps.semantic_version_rc.outputs.version }}
            echo "version=${{ steps.semantic_version_rc.outputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "No version generated"
            exit 1
          fi

      - name: Print debug
        run: |
          if [ -n "${{ steps.semantic_version_rc.outputs.version }}" ]; then
            echo ${{ steps.semantic_version_rc.outputs.debug_output }}
          fi

  prepare-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: prepare-version
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Token Github
        id: get-token-github
        uses: actions/create-github-app-token@v1
        with:
          # required
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PEM_FILE }}
          owner: 'gridware'

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          custom_tag: ${{ needs.prepare-version.outputs.version }}
          tag_prefix: ''
          commit_sha: >-
            ${{ inputs.commit-sha }}
          github_token: ${{ steps.get-token-github.outputs.token }}
          create_annotated_tag: true
