name: Link Jira Ticket in PR

on:
  pull_request:
    types: [opened]

jobs:
  link-jira:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR
        uses: actions/checkout@v3

      - name: Extract Jira ticket and post comment
        uses: actions/github-script@v7
        with:
          script: |
            const prBody = context.payload.pull_request.body || "";
            const prTitle = context.payload.pull_request.title || "";
            const ticketRegex = /\bDVS-\d+\b/g;

            const matches = [...new Set([
              ...(prTitle.match(ticketRegex) || []),
              ...(prBody.match(ticketRegex) || [])
            ])];

            if (matches.length === 0) {
              console.log("No Jira ticket found.");
              return;
            }

            const jiraBaseUrl = "https://grid-ware.atlassian.net/browse/";
            const commentBody = matches.map(ticket => `🔗 [${ticket}](${jiraBaseUrl}${ticket})`).join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Jira ticket(s) linked:\n${commentBody}`
            });
